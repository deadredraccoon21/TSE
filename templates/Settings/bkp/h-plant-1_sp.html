<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set Point</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/font.css') }}"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <style>
      /* ... (keep all your existing CSS styles, they are perfect) ... */
      .btn-success {
        color: #fff;
        background-color: #5cb85c;
        border-color: #5cb85c;
        border-radius: 3px;
        border-style: solid;
        box-shadow: none;
      }

      .btn-success:focus,
      .btn-success.focus {
        color: #fff;
        background-color: #449d44;
        border-color: #255625;
      }

      .btn-success:hover {
        color: #fff;
        background-color: #449d44;
        border-color: #398439;
      }

      .btn-danger {
        color: #fff;
        background-color: #d9534f;
        border-color: #d43f3a;
        border-style: solid;
        box-shadow: none;
        border-radius: 3px;
      }

      .btn-danger:focus,
      .btn-danger.focus {
        color: #fff;
        background-color: #c9302c;
        border-color: #761c19;
      }

      .btn-danger:hover {
        color: #fff;
        background-color: #c9302c;
        border-color: #ac2925;
      }

      .dialog-container {
        width: 120%;
        transform: translate(200%, 80%);
        margin: auto;
        background: #e3f4ff;
        border: 1px solid #0c609d;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      .dialog-header {
        background: #0c609d;
        color: white;
        padding: 10px;
        font-weight: bold;
        border-radius: 10px 10px 0 0;
      }

      .dialog-body {
        padding: 10px;
      }

      .dialog-body table {
        width: 100%;
        border-collapse: collapse;
      }

      .dialog-body th,
      .dialog-body td {
        padding: 8px;
        text-align: center;
        border: 1px solid #0c609d;
      }

      .value-box {
        display: inline-block;
        width: 50px;
        padding: 5px;
        background: #007bff;
        color: white;
        font-weight: bold;
        border-radius: 5px;
      }

      .set-box input {
        width: 60px;
        padding: 5px;
        text-align: center;
        border: 1px solid #4caf50;
        border-radius: 5px;
      }

      .dialog-footer {
        padding: 10px;
        text-align: right;
        background: #e3f4ff;
        border-radius: 0 0 10px 10px;
      }

      .btn {
        margin: 5px;
      }
    </style>
  </head>

  <body>
    <div class="dialog-container" id="setPointDialog">
      <div class="dialog-header">SET POINT</div>

      <div class="dialog-body">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th></th>
              <th>Actual</th>
              <th>Set</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><b>% RH</b></td>
              <td>
                <!-- DYNAMIC ID and VALUE -->
                <span class="value-box" id="{{ prefix }}_iVa_Act_RH"
                  >{{ msg.payload[prefix ~ '_iVa_Act_RH'] | default(0) |
                  round(1) }}</span
                >
              </td>
              <td class="set-box">
                <!-- DYNAMIC ID, VALUE, and DATA-NODEID -->
                <input
                  type="number"
                  class="setpoint-input"
                  id="{{ prefix }}_iMi_Set_RH"
                  value="{{ msg.payload[prefix ~ '_iMi_Set_RH'] | default(0) | round(1) }}"
                  data-nodeid="{{ msg.node_ids[prefix ~ '_iMi_Set_RH'] }}"
                />
              </td>
            </tr>
            <tr>
              <td><b>°C</b></td>
              <td>
                <!-- DYNAMIC ID and VALUE -->
                <span class="value-box" id="{{ prefix }}_iVa_Act_Temp"
                  >{{ msg.payload[prefix ~ '_iVa_Act_Temp'] | default(0) |
                  round(1) }}</span
                >
              </td>
              <td class="set-box">
                <!-- DYNAMIC ID, VALUE, and DATA-NODEID -->
                <input
                  type="number"
                  class="setpoint-input"
                  id="{{ prefix }}_iMi_Set_Temp"
                  value="{{ msg.payload[prefix ~ '_iMi_Set_Temp'] | default(0) | round(1) }}"
                  data-nodeid="{{ msg.node_ids[prefix ~ '_iMi_Set_Temp'] }}"
                />
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="dialog-footer">
        <button class="btn btn-danger" onclick="closeDialog()">Close</button>
        <button class="btn btn-success" onclick="updateSettings()">
          Update
        </button>
      </div>
    </div>

    <script>
      // No changes are needed in this script.
      // It's generic enough to work with the dynamically generated IDs.
      const socket = io();

      socket.on("update", function (data) {
        Object.keys(data).forEach((key) => {
          // This will now correctly find elements with IDs like "{{ prefix }}_iVa_Act_RH"
          const element = document.getElementById(key);
          if (!element) return;

          const value =
            data[key] !== undefined && data[key] !== null ? data[key] : 0;

          if (element.tagName === "SPAN") {
            element.innerText = parseFloat(value).toFixed(1);
          } else if (element.tagName === "INPUT" && element.type === "number") {
            if (document.activeElement !== element) {
              element.value = parseFloat(value).toFixed(1);
            }
          }
        });
      });

      function updateSettings() {
        const setpoints = {};
        const inputs = document.querySelectorAll(".setpoint-input");

        inputs.forEach((input) => {
          const nodeId = input.dataset.nodeid;
          if (nodeId) {
            setpoints[nodeId] = input.value;
          }
        });

        if (Object.keys(setpoints).length === 0) {
          alert("Could not find any settings to update.");
          return;
        }

        fetch("/write", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(setpoints),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              alert("Settings updated successfully!");
            } else {
              alert(
                "Failed to update settings: " + (data.error || "Unknown error")
              );
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred while updating settings.");
          });
      }

      function closeDialog() {
        const dialog = document.getElementById("setPointDialog");
        if (dialog) {
          // To prevent errors if the element is removed by other means
          dialog.style.display = "none";
          // Optional: remove the element completely
          // dialog.parentNode.removeChild(dialog);
        }
      }
    </script>
  </body>
</html>
