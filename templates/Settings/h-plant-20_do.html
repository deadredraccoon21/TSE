<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Output</title>
    <!-- Include Bootstrap CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="static\css\font.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet"> -->

    <style>
      .btn-success {
        color: #fff;
        background-color: #5cb85c;
        border-color: #5cb85c;
        border-radius: 3px;
        border-style: solid;
        box-shadow: none;
      }
      .btn-success:focus,
      .btn-success.focus {
        color: #fff;
        background-color: #449d44;
        border-color: #255625;
      }
      .btn-success:hover {
        color: #fff;
        background-color: #449d44;
        border-color: #398439;
      }

      .btn-danger {
        color: #fff;
        background-color: #d9534f;
        border-color: #d43f3a;
        border-style: solid;
        box-shadow: none;
        border-radius: 3px;
      }
      .btn-danger:focus,
      .btn-danger.focus {
        color: #fff;
        background-color: #c9302c;
        border-color: #761c19;
      }
      .btn-danger:hover {
        color: #fff;
        background-color: #c9302c;
        border-color: #ac2925;
      }

      .dialog-box {
        /* max-width: 30%; */
        width: 200%;
        transform: translate(150%, 80%);
        border: 1px solid #333;
        border-radius: 8px;
        background-color: #e3f4ff;
        padding: 10px;
        margin: 0 auto;
        box-sizing: border-box;
        position: relative;
        top: -20px;
        font-size: 12px;
      }

      .header {
        background-color: #0c609d;
        color: white;
        text-align: center;
        font-size: 16px;
        font-weight: bold;
        padding: 6px;
        border-radius: 6px;
        margin-bottom: 10px;
      }

      .row-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 5px;
        margin-bottom: 5px;
      }

      .parameter {
        width: 100%;
        height: 30px;
        text-align: center;
        line-height: 30px;
        font-size: 10px;
        font-weight: bold;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #c9f6ff;
        color: black;
      }

      .parameters {
        width: 100%;
        height: 30px;
        text-align: center;
        line-height: 30px;
        font-size: 10px;
        font-weight: bold;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #c9f6ff;
        color: black;
      }

      .value {
        background-color: #007bff;
        color: white;
        font-weight: 600;
        text-align: center;
        border: 1px solid #333;
        border-radius: 4px;
        line-height: 30px;
        padding-right: 6px;
      }

      .set-box input {
        width: 98%;
        height: 30px;
        background: #4caf50;
        color: white;
        font-weight: 600;
        text-align: center;
        border: 1px solid #333;
        border-radius: 4px;
        line-height: 30px;
      }

      
      .m-value-row .value {
        background-color: #28a745;
        color: white;
      }

      .set-box input:focus {
        outline: none;
        box-shadow: 0 0 3px rgba(76, 175, 80, 0.8);
      }

      .dialog-footer {
        text-align: right;
        background: #e3f4ff;
      }

      .dialog-footer button {
        margin-left: 6px;
      }

      /* Styling for toggle switch */
      .switch-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
        margin-right: 3px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #7dcbff;
        transition: 0.3s;
        border-radius: 34px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        border-radius: 50%;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
      }

      input:checked + .slider {
        background-color: #0c609d;
      }

      input:checked + .slider:before {
        transform: translateX(14px);
      }

      .mode-text {
        font-size: 9px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="dialog-box mt-5">
      <!-- Header -->
      <div class="header">DIGITAL OUTPUTS</div>

      <!-- Row 1: Status Display -->
      <div class="row-container">
        <div
          class="parameter"
          style="background-color: rgb(0, 86, 128); color: white"
        >
          PARAMETER
        </div>
        <div
          class="parameter"
          style="background-color: rgb(0, 86, 128); color: white"
        >
          WASHER PUMP
        </div>
        <!-- <div class="parameter" style="background-color: rgb(0, 86, 128); color:white">WASHER PUMP-2</div> -->
      </div>
      <div class="row-container">
        <div
          class="parameter"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          Value
        </div>
        <div class="value" id="{{ prefix }}_DO_Pump_Act">
          {{ 1 if msg.payload[prefix ~ '_DO_Pump_Act'] else 0 }}
        </div>
        <!-- <div class="value" id="{{ prefix }}_DO_Pump_Act2">{{ 1 if msg.payload[prefix ~ '_DO_Pump_Act2'] else 0 }}</div> -->
      </div>

      <!-- Row 2: Manual Value Inputs -->
      <div class="row-container m-value-row">
        <div
          class="parameters"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          M-Value
        </div>
        <div class="set-box">
          <input
            type="number"
            class="setpoint-input"
            id="{{ prefix }}_iMi_DO_Man"
            value="{{ 1 if msg.payload[prefix ~ '_iMi_DO_Man'] else 0 }}"
            min="0"
            max="1"
            step="1"
            oninput="validateInput(this)"
            data-nodeid="{{ msg.node_ids[prefix ~ '_iMi_DO_Man'] }}"
          />
        </div>
        <!-- <div class="set-box">
                <input type="number" class="setpoint-input" id="{{ prefix }}_iMi_DO_Man2" value="{{ 1 if msg.payload[prefix ~ '_iMi_DO_Man2'] else 0 }}"
                    min="0" max="1" step="1" oninput="validateInput(this)"
                    data-nodeid="{{ msg.node_ids[prefix ~ '_iMi_DO_Man2'] }}" />
            </div> -->
      </div>

      <!-- Row 3: Dynamic Mode Switches -->
      <div class="row-container">
        <div
          class="parameter"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          Mode
        </div>
        <div class="parameter">
          <div class="switch-container">
            <label class="switch">
              <input type="checkbox" id="{{ prefix }}_iFl_Start_DO_B" {{
              'checked' if msg.payload[prefix ~ '_iFl_Start_DO_B'] else '' }}
              data-nodeid="{{ msg.node_ids[prefix ~ '_iFl_Start_DO_B'] }}"
              onchange="updateMode(this)">
              <span class="slider"></span>
            </label>
            <span id="{{ prefix }}_iFl_Start_DO_B-text" class="mode-text"
              >{{ 'Manual' if msg.payload[prefix ~ '_iFl_Start_DO_B'] else
              'Auto' }}</span
            >
          </div>
        </div>

        <!-- <div class="parameter">
                <div class="switch-container">
                    <label class="switch">
                        <input type="checkbox" id="{{ prefix }}_iFl_Start_DO_B2" {{ 'checked' if msg.payload[prefix ~ '_iFl_Start_DO_B2'] else '' }}
                               data-nodeid="{{ msg.node_ids[prefix ~ '_iFl_Start_DO_B2'] }}" onchange="updateMode(this)">
                        <span class="slider"></span>
                    </label>
                    <span id="{{ prefix }}_iFl_Start_DO_B2-text" class="mode-text">{{ 'Manual' if msg.payload[prefix ~ '_iFl_Start_DO_B2'] else 'Auto' }}</span>
                </div>
            </div> -->
      </div>

      <div class="dialog-footer">
        <button class="btn btn-danger" onclick="closeDialog()">Close</button>
        <button class="btn btn-success" onclick="updateSettings()">
          Update
        </button>
      </div>
    </div>

    <script>
      const socket = io();

      // This listener handles all real-time updates from the server
      socket.on("update", function (data) {
        Object.keys(data).forEach((key) => {
          const element = document.getElementById(key);
          if (!element) return;

          if (element.classList.contains("value")) {
            // Update blue value boxes (display 1 or 0)
            element.innerText = data[key] ? "1" : "0";
          } else if (element.tagName === "INPUT" && element.type === "number") {
            // Update green number inputs if not focused (display 1 or 0)
            if (document.activeElement !== element) {
              element.value = data[key] ? "1" : "0";
            }
          } else if (
            element.tagName === "INPUT" &&
            element.type === "checkbox"
          ) {
            // Update checkboxes and their associated text
            element.checked = data[key];
            const textElement = document.getElementById(element.id + "-text");
            if (textElement) {
              textElement.textContent = data[key] ? "Manual" : "Auto";
            }
          }
        });
      });

      /**
       * Sends an update for a single mode switch (checkbox) immediately on change.
       */
      function updateMode(checkbox) {
        const nodeId = checkbox.dataset.nodeid;
        const isChecked = checkbox.checked;

        if (!nodeId) {
          console.error("No nodeid found for this switch:", checkbox.id);
          return;
        }

        // The payload is a single key-value pair { nodeId: boolean }
        const payload = { [nodeId]: isChecked };

        // Update the text label immediately for better UX
        const textElement = document.getElementById(checkbox.id + "-text");
        if (textElement) {
          textElement.textContent = isChecked ? "Manual" : "Auto";
        }

        fetch("/write", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }).catch((error) => console.error("Error updating mode:", error));
      }

      /**
       * Sends updates for all Manual Value inputs when the 'Update' button is clicked.
       */
      function updateSettings() {
        const payload = {};
        const inputs = document.querySelectorAll(".setpoint-input");

        inputs.forEach((input) => {
          const nodeId = input.dataset.nodeid;
          if (nodeId) {
            // Convert the input value '1' or '0' to a true boolean
            payload[nodeId] = input.value === "1";
          }
        });

        if (Object.keys(payload).length === 0) {
          alert("No settings found to update.");
          return;
        }

        fetch("/write", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              alert("Settings updated successfully!");
            } else {
              alert(
                "Failed to update settings: " + (data.error || "Unknown error")
              );
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred during the update.");
          });
      }

      function closeDialog() {
        const dialogBox = document.querySelector(".dialog-box");
        if (dialogBox) {
          dialogBox.style.display = "none";
        }
      }

      // Client-side validation to only allow 0 or 1 in the M-Value inputs.
      function validateInput(input) {
        if (input.value !== "0" && input.value !== "1" && input.value !== "") {
          input.value = ""; // Reset if invalid
        }
      }
    </script>
  </body>
</html>
