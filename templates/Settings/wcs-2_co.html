<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Inputs Dialog</title>
    <!-- Include Bootstrap CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="static\css\font.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <style>
      /* Your CSS is perfect and remains unchanged */
      .parameter {
        background-color: rgb(0, 86, 128);
      }
      .btn-success {
        color: #fff;
        background-color: #5cb85c;
        border-color: #5cb85c;
        border-radius: 3px;
        border-style: solid;
        box-shadow: none;
      }
      .btn-success:focus,
      .btn-success.focus {
        color: #fff;
        background-color: #449d44;
        border-color: #255625;
      }
      .btn-success:hover {
        color: #fff;
        background-color: #449d44;
        border-color: #398439;
      }
      .btn-danger {
        color: #fff;
        background-color: #d9534f;
        border-color: #d43f3a;
        border-style: solid;
        box-shadow: none;
        border-radius: 3px;
      }
      .btn-danger:focus,
      .btn-danger.focus {
        color: #fff;
        background-color: #c9302c;
        border-color: #761c19;
      }
      .btn-danger:hover {
        color: #fff;
        background-color: #c9302c;
        border-color: #ac2925;
      }
      .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 998;
      }
      .disabled {
        pointer-events: none;
        opacity: 0.4;
      }
      .dialog-box {
        width: 130%; /* MODIFIED: Adjusted for 3 columns */
        
        transform: translate(105%, 60%);
        border: 1px solid #333;
        border-radius: 8px;
        background-color: #e3f4ff;
        padding: 12px;
        margin: 0 auto;
        position: relative;
        top: 20px;
      }
      .header {
        background-color: #0c609d;
        color: white;
        text-align: center;
        font-size: 16px;
        font-weight: bold;
        padding: 6px;
        border-radius: 6px;
        margin-bottom: 10px;
      }
      .row-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* MODIFIED: Set to 3 columns */
        gap: 4px;
        margin-bottom: 4px;
      }
      .parameter {
        width: 100%;
        height: 32px;
        text-align: center;
        line-height: 32px;
        font-size: 10px;
        font-weight: bold;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #c9f6ff;
      }
      .value {
        background-color: #007bff;
        color: white;
        font-weight: bold;
        text-align: center;
        border: 1px solid #333;
        border-radius: 4px;
        line-height: 32px;
        font-size: 10px;
      }
      .set-box input {
        width: 100%;
        height: 32px;
        background: #4caf50;
        color: white;
        font-weight: bold;
        text-align: center;
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 10px;
      }
      .m-value-row .value {
        background-color: #28a745;
        color: white;
      }
      .set-box input:focus {
        outline: none;
        box-shadow: 0 0 3px rgba(76, 175, 80, 0.6);
      }
      .dialog-footer {
        text-align: right;
        padding-top: 6px;
      }
      .dialog-footer button {
        margin-left: 6px;
        padding: 3px 8px;
        font-size: 12px;
      }
      .switch-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 32px;
        height: 18px;
        margin-right: 4px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #7dcbff;
        transition: 0.3s;
        border-radius: 34px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        border-radius: 50%;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
      }
      input:checked + .slider {
        background-color: #0c609d;
      }
      input:checked + .slider:before {
        transform: translateX(12px);
      }
      .mode-text {
        font-size: 8px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="dialog-box">
      <!-- Header -->
      <div class="header">CONTROLLERS</div>

      <!-- Row 1: Parameter Headers -->
      <div class="row-container">
        <div
          class="parameter"
          style="background-color: rgb(0, 86, 128); color: white"
        >
          PARAMETER
        </div>
        <div
          class="parameter"
          style="background-color: rgb(0, 86, 128); color: white"
        >
          Values
        </div>
      </div>
      <!-- Row 2: Dynamic Process Values -->
      <div class="row-container">
        <div
          class="parameter"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          Act Pressure
        </div>
        <div class="value" id="{{ prefix }}_iVa_DPT_PDF">
          {{ msg.payload[prefix ~ '_iVa_DPT_PDF'] | default(0) | round(1) }}
        </div>
      </div>

      <!-- Row 3: Dynamic Set Point Inputs -->
      <div class="row-container">
        <div
          class="parameter"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          Set Pressure
        </div>

        <div class="set-box">
          <input
            type="number"
            class="setpoint-input"
            id="{{ prefix }}_iMi_Set_Pressure"
            value="{{ msg.payload[prefix ~ '_iMi_Set_Pressure'] | default(0) | round(1) }}"
            data-nodeid="{{ msg.node_ids[prefix ~ '_iMi_Set_Pressure'] }}"
          />
        </div>
      </div>

      <!-- Row 4: Dynamic P.GAIN Inputs -->
      <div class="row-container m-value-row">
        <div
          class="parameter"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          P Gain
        </div>
        <div class="set-box">
          <input
            type="number"
            class="setpoint-input"
            id="{{ prefix }}_FDP_Pid_Para.Gain"
            value="{{ msg.payload[prefix ~ '_FDP_Pid_Para.Gain'] | default(0) | round(1) }}"
            data-nodeid="{{ msg.node_ids[prefix ~ '_FDP_Pid_Para.Gain'] }}"
          />
        </div>
      </div>

      <!-- Row 5: Dynamic Integration Time Inputs -->
      <div class="row-container m-value-row">
        <div
          class="parameter"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          I-Time
        </div>
        <div class="set-box">
          <input
            type="number"
            class="setpoint-input"
            id="{{ prefix }}_FDP_Pid_Para.IntegrationTime"
            value="{{ msg.payload[prefix ~ '_FDP_Pid_Para.IntegrationTime'] | default(0) | round(1) }}"
            data-nodeid="{{ msg.node_ids[prefix ~ '_FDP_Pid_Para.IntegrationTime'] }}"
          />
        </div>
      </div>

      <!-- Row 6: Dynamic OUTPUT(Y) Values -->
      <div class="row-container">
        <div
          class="parameter"
          style="background-color: rgb(20, 105, 46); color: white"
        >
          Output(Y)
        </div>
        <div class="value" id="{{ prefix }}_iVa_Pid_Out_FDP">
          {{ msg.payload[prefix ~ '_iVa_Pid_Out_FDP'] | default(0) | round(1) }}
        </div>
      </div>

      <div class="dialog-footer">
        <button class="btn btn-danger" onclick="closeDialog()">Close</button>
        <button
          class="btn btn-success"
          id="{{ prefix }}_iFl_Update_Pid_FD"
          data-nodeid="{{ msg.node_ids[prefix ~ '_iFl_Update_Pid_FD'] }}"
          onclick="updateSettings(this)"
        >
          Update
        </button>
      </div>
    </div>

    <script>
      const socket = io();

      // This listener handles all real-time updates from the server
      socket.on("update", function (data) {
        Object.keys(data).forEach((key) => {
          const element = document.getElementById(key);
          if (!element) return;

          if (element.classList.contains("value")) {
            // Update blue/green value boxes
            element.innerText = data[key];
          } else if (element.tagName === "INPUT" && element.type === "number") {
            // Update number input boxes only if not focused
            if (document.activeElement !== element) {
              element.value = data[key];
            }
          }
        });
      });

      /**
       * Sends updates for all setpoints, gains, and integration times when 'Update' is clicked.
       * It reads Node IDs from the data attributes of elements with class 'setpoint-input'.
       */
      function updateSettings(buttonElement) {
        const payload = {};
        // Select all number inputs that need to be sent on update
        const inputs = document.querySelectorAll(".setpoint-input");

        inputs.forEach((input) => {
          const nodeId = input.dataset.nodeid;
          if (nodeId) {
            payload[nodeId] = input.value;
          }
        });

        // Add the button's node ID to the payload to trigger the update on the server
        if (buttonElement) {
          const nodeId = buttonElement.dataset.nodeid;
          if (nodeId) {
            payload[nodeId] = true;
          }
        }

        if (Object.keys(payload).length === 0) {
          alert("No settings found to update.");
          return;
        }

        fetch("/write", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              alert("Settings updated successfully!");
            } else {
              alert(
                "Failed to update settings: " + (data.error || "Unknown error")
              );
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred during the update.");
          });
      }

      function closeDialog() {
        const dialogBox = document.querySelector(".dialog-box");
        if (dialogBox) {
          dialogBox.style.display = "none";
        }
      }
    </script>
  </body>
</html>
