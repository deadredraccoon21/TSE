<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #e3f4ff;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
          sans-serif;
      }

      .top-buttons-container {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 9999;
      }

      .action-button {
        position: relative;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        color: white;
        padding: 8px 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .action-button:hover {
        opacity: 0.8;
      }

      .add-user-button {
        background-color: rgb(26, 26, 255);
      }
      .add-admin-button {
        background-color: green;
      }
      .logout-button {
        background-color: #f44336;
      }

      .update-btn {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        display: block;
        margin: 20px auto;
      }

      h1,
      h2 {
        color: black;
        text-align: center;
      }

      .checkbox-section {
        background-color: #f3fbff;
        padding: 20px;
        margin: 20px 10%;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      .checkbox-section label {
        font-size: large;
        font-weight: bold;
        margin-left: 5px;
      }

      .checkbox-item {
        display: block;
        margin-bottom: 8px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="row">
        <h1
          style="
            width: 100%;
            text-align: center;
            margin-top: 50px;
            color: rgb(4, 92, 119);
          "
        >
          <u><b>Report Admin Dashboard</b></u>
        </h1>
      </div>
    </div>

    <!-- Top Navigation Buttons -->
    <div class="top-buttons-container">
      <button
        class="action-button add-user-button"
        onclick="window.location.href='/users'"
      >
        Manage Users
      </button>
      <button
        class="action-button add-admin-button"
        onclick="window.location.href='/admins'"
      >
        Manage Admins
      </button>
      <button
        class="action-button logout-button"
        onclick="window.location.href='/admin_logout'"
      >
        Logout
      </button>
    </div>

    <div class="checkbox-section">
      <label><b>Select Report Fields to Display:</b></label
      ><br />
      <div class="checkbox-item">
        <input type="checkbox" id="select_all" onclick="toggleAllOptions()" />
        <label for="select_all">Select All</label>
      </div>

      <!-- List of checkboxes -->
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Set_RH"
          value="Set_RH"
        /><label for="Set_RH">Set_RH</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Act_RH"
          value="Act_RH"
        /><label for="Act_RH">Act_RH</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="WTC_Output"
          value="WTC_Output"
        /><label for="WTC_Output">WTC_Output</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="WP_Status"
          value="WP_Status"
        /><label for="WP_Status">WP_Status</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="SAF_Speed"
          value="SAF_Speed"
        /><label for="SAF_Speed">SAF_Speed</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="RetAF_Speed"
          value="RetAF_Speed"
        /><label for="RetAF_Speed">RetAF_Speed</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Set_Temp"
          value="Set_Temp"
        /><label for="Set_Temp">Set_Temp</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Act_Temp"
          value="Act_Temp"
        /><label for="Act_Temp">Act_Temp</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Act_WoT"
          value="Act_WoT"
        /><label for="Act_WoT">Act_WoT</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Set_WoT"
          value="Set_WoT"
        /><label for="Set_WoT">Set_WoT</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Damper_Output"
          value="Damper_Output"
        /><label for="Damper_Output">Damper_Output</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Set_PR"
          value="Set_PR"
        /><label for="Set_PR">Set_PR</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="Act_PR"
          value="Act_PR"
        /><label for="Act_PR">Act_PR</label>
      </div>
      <div class="checkbox-item">
        <input
          type="checkbox"
          class="field-checkbox"
          id="RadialFan_Speed"
          value="RadialFan_Speed"
        /><label for="RadialFan_Speed">RadialFan_Speed</label>
      </div>
    </div>

    <!-- UPDATE BUTTON -->
    <button class="update-btn" onclick="saveSettings()">Update Settings</button>

    <script>
      // Use Jinja to inject the current database configuration into JS
      const savedFields = {{ current_fields | tojson | default([]) }};

      document.addEventListener('DOMContentLoaded', function () {
          // Pre-check boxes based on server data
          savedFields.forEach(function (field) {
              var checkbox = document.querySelector('.field-checkbox[value="' + field + '"]');
              if (checkbox) {
                  checkbox.checked = true;
              }
          });
          checkSelectAllStatus();
      });

      function toggleAllOptions() {
          var selectAllCheckbox = document.getElementById('select_all');
          var fieldCheckboxes = document.querySelectorAll('.field-checkbox');
          fieldCheckboxes.forEach(function (checkbox) {
              checkbox.checked = selectAllCheckbox.checked;
          });
      }

      // Helper to check if "Select All" should be checked
      function checkSelectAllStatus() {
          var fieldCheckboxes = document.querySelectorAll('.field-checkbox');
          var allChecked = true;
          fieldCheckboxes.forEach(function(cb){ if(!cb.checked) allChecked = false; });
          document.getElementById('select_all').checked = allChecked;
      }

      function saveSettings() {
          var selected_columns = [];
          var fieldCheckboxes = document.querySelectorAll('.field-checkbox');

          fieldCheckboxes.forEach(function (checkbox) {
              if (checkbox.checked) {
                  selected_columns.push(checkbox.value);
              }
          });

          // Send to Backend
          fetch('/update_report_settings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fields: selected_columns })
          })
          .then(response => response.json())
          .then(data => {
              if (data.success) {
                  alert('Settings updated successfully!');
              } else {
                  alert('Error updating settings: ' + data.error);
              }
          })
          .catch(err => {
              console.error(err);
              alert('Network error occurred.');
          });
      }

      // Add listener to checkboxes to update "Select All" status dynamically
      var fieldCheckboxes = document.querySelectorAll('.field-checkbox');
      fieldCheckboxes.forEach(function (checkbox) {
          checkbox.addEventListener('change', checkSelectAllStatus);
      });
    </script>
  </body>
</html>
