    <style>
      /* General page styles */
      body {
        user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        -moz-user-select: none;
        -webkit-touch-callout: none;
        context-menu: none;
      }

      /* --- CSS Classes for Button Status --- */
      .status-button {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        outline: none;
        transition: background-color 0.3s ease, box-shadow 0.3s ease,
          border 0.3s ease;
        border: 1px solid black;
      }

      .status-on {
        background-color: #28a745; /* Green */
        box-shadow: 0 0 8px rgba(40, 167, 69, 0.8);
      }

      .status-off {
        background-color: #dc3545; /* Red */
      }

      .status-trip {
        background-color: #ffc107; /* Yellow */
        box-shadow: 0 0 8px rgba(255, 193, 7, 0.8);
      }

      /* Normal state for trip buttons is now invisible */
      .status-normal {
        background-color: transparent;
        border-color: transparent;
      }

      /* Class for when neither ON nor OFF is active */
      .status-indeterminate {
        background-color: transparent;
        border-color: transparent;
      }

      /* Class to hide elements before the first data update */
      .initially-hidden {
        display: none;
      }

      /* Class for the Manual Mode 'M' Symbol */
      .manual-mode-symbol {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: #dc3545; /* Red */
        color: white;
        border: 1.5px solid black;
        font-weight: bold;
        font-size: 14px;
           /* font-family: Arial, sans-serif; */
        display: none; /* Hidden by default */
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
    </style>
  </head>

    <script>
      let isFirstUpdate = true;

      // Note: These keys assume the WCS_Comber_ prefix.
      const onOffNodePairs = {
        "tf1-on-off": {
          on: "DI_WCS_Comber_iFl_TR_Fan1_ON",
          off: "DI_WCS_Comber_iFl_TR_Fan1_OFF",
        },
        "comp1-on-off": {
          on: "DI_WCS_Comber_iFl_Compactor1_ON",
          off: "DI_WCS_Comber_iFl_Compactor1_OFF",
        },
        "tf2-on-off": {
          on: "DI_WCS_Comber_iFl_TR_Fan2_ON",
          off: "DI_WCS_Comber_iFl_TR_Fan2_OFF",
        },
        "comp2-on-off": {
          on: "DI_WCS_Comber_iFl_Compactor2_ON",
          off: "DI_WCS_Comber_iFl_Compactor2_OFF",
        },
        "pdf-on-off": {
          on: "DI_WCS_Comber_iFl_PDF_ON",
          off: "DI_WCS_Comber_iFl_PDF_OFF",
        },
        "maf-on-off": {
          on: "DI_WCS_Comber_iFl_MainAirFan_ON",
          off: "DI_WCS_Comber_iFl_MainAirFan_OFF",
        },
        "rdf-on-off": {
          on: "DI_WCS_Comber_iFl_RDF_ON",
          off: "DI_WCS_Comber_iFl_RDF_OFF",
        },
        "sf-on-off": {
          on: "DI_WCS_Comber_iFl_Conveyance_Fan_ON",
          off: "DI_WCS_Comber_iFl_Conveyance_Fan_OFF",
        },
        "sc-on-off": {
          on: "DI_WCS_Comber_iFl_Cyclone_ON",
          off: "DI_WCS_Comber_iFl_Cyclone_OFF",
        },
      };

      const tripNodeMappings = {
        DI_WCS_Comber_iFl_TR_Fan1_Trip: "tf1-trip",
        DI_WCS_Comber_iFl_Compactor1_Trip: "comp1-trip",
        DI_WCS_Comber_iFl_TR_Fan2_Trip: "tf2-trip",
        DI_WCS_Comber_iFl_Compactor2_Trip: "comp2-trip",
        DI_WCS_Comber_iFl_PDF_Trip: "pdf-trip",
        DI_WCS_Comber_iFl_MainAirFan_Trip: "maf-trip",
        DI_WCS_Comber_iFl_RDF_Trip: "rdf-trip",
        DI_WCS_Comber_iFl_Conveyance_Fan_Trip: "sf-trip",
        DI_WCS_Comber_iFl_Cyclone_Trip: "sc-trip",
      };

      socket.on("update", function (data) {
        if (isFirstUpdate) {
          document.querySelectorAll(".initially-hidden").forEach((el) => {
            el.style.display = "flex"; // Use flex to center the button inside
            el.classList.remove("initially-hidden");
          });
          isFirstUpdate = false;
        }

        // --- Part 1: Update numerical values ---
        document.getElementById("WCS_Comber_iVa_DPT_RDF").textContent =
          data["WCS_Comber_iVa_DPT_RDF"] || "0";
        document.getElementById("WCS_Comber_iVa_DPT_PDF").textContent =
          data["WCS_Comber_iVa_DPT_PDF"] || "0";
        document.getElementById("WCS_Comber_iVa_Radial_Fan").textContent =
          data["WCS_Comber_iVa_Radial_Fan"] || "0";

        // --- Part 2: Update button statuses ---
        for (const buttonId in onOffNodePairs) {
          const button = document.getElementById(buttonId);
          if (button) {
            const { on: onNode, off: offNode } = onOffNodePairs[buttonId];
            button.classList.remove(
              "status-on",
              "status-off",
              "status-indeterminate"
            );

            if (data[onNode]) {
              button.classList.add("status-on");
            } else if (data[offNode]) {
              button.classList.add("status-off");
            } else {
              button.classList.add("status-indeterminate");
            }
          }
        }

        for (const nodeId in tripNodeMappings) {
          const buttonId = tripNodeMappings[nodeId];
          const button = document.getElementById(buttonId);
          if (button) {
            button.classList.remove("status-trip", "status-normal");
            button.classList.add(
              data[nodeId] ? "status-trip" : "status-normal"
            );
          }
        }

        // --- Part 3: Update Manual Mode 'M' Symbol Visibility ---
        updateManualSymbolVisibility(
          "m-symbol-rdf",
          data["WCS_Comber_iFl_Set_DPT_RDF_Man_B"]
        );
        updateManualSymbolVisibility(
          "m-symbol-pdf",
          data["WCS_Comber_iFl_Set_DPT_PDF_Man_B"]
        );
        updateManualSymbolVisibility(
          "m-symbol-maf",
          data["WCS_Comber_iFl_RadialFan_Output_Man_B"]
        );
      });

      function updateManualSymbolVisibility(elementId, isManual) {
        const symbol = document.getElementById(elementId);
        if (symbol) {
          symbol.style.display = isManual ? "flex" : "none";
        }
      }

      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
{% endblock %}
