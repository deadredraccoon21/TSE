{% extends "iot/tse.html" %} {% block title %}Dashboard{% endblock %} {% block
content %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <style>
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding-top: 60px;
        background-color: #e3f4ff;
      }
      .common-container {
        border: 1px solid black;
        border-radius: 15px;
        height: 260px;
        width: 96%;
        padding: 10px;
        background: linear-gradient(#0076ce 0%, #add8e6 58%);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        color: white;
        box-sizing: border-box;
      }
      .common-container h2 {
        font-size: 24px;
        margin: 5px 0;
        text-align: center;
      }
      .sensor-data {
        font-family: "Times New Roman", Times, serif;
        font-size: 15px;
        text-align: center;
        margin-bottom: 10px;
      }
      .chart-container {
        width: 100%;
        height: 160px;
        background-color: white;
        border-radius: 10px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- This loop is now driven by the 'dashboard_items' list from input.yaml -->
      {% for item in dashboard_items %}
      <div class="common-container">
        <h2>{{ item.name }}</h2>
        <div class="sensor-data">
          <div
            style="
              display: flex;
              justify-content: space-between;
              width: 100%;
              font-weight: bold;
            "
          >
            <!-- IDs are now generated from the item name to be unique and meaningful -->
            <div><span id="{{ item.name|slugify }}_temp">0.00</span> °C</div>
            <div><span id="{{ item.name|slugify }}_hum">0.00</span> %RH</div>
          </div>
        </div>
        <div class="chart-container">
          <!-- The canvas ID is also made unique -->
          <canvas id="chart_{{ item.name|slugify }}"></canvas>
        </div>
      </div>
      {% endfor %}
    </div>

    <script>
        // A single, global socket instance for the dashboard
      //  const socket = io();

        /**
         * Sets up a single department card with its chart and data updates.
         * @param {string} name - The display name of the department.
         * @param {string} slug - A URL-safe version of the name, used for element IDs.
         * @param {string} tempNodeKey - The key for the temperature value from the socket data.
         * @param {string} humNodeKey - The key for the humidity value from the socket data.
         */
        function setupDepartment(name, slug, tempNodeKey, humNodeKey) {
            const tempElement = document.getElementById(`${slug}_temp`);
            const humElement = document.getElementById(`${slug}_hum`);
            const chartCtx = document.getElementById(`chart_${slug}`).getContext('2d');

            if (!tempElement || !humElement || !chartCtx) {
                console.error(`Initialization failed: Missing elements for department "${name}"`);
                return;
            }

            const chart = new Chart(chartCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Temperature', data: [], backgroundColor: 'rgba(255, 148, 112)', borderColor: 'rgba(255, 148, 112)' },
                        { label: 'Humidity', data: [], backgroundColor: 'rgba(40, 67, 135)', borderColor: 'rgba(40, 67, 135)' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'second' }, ticks: { font: { size: 10 }, maxTicksLimit: 6 }},
                        y: { beginAtZero: true }
                    },
                    plugins: {
                        legend: { display: false } // Hide legend to save space
                    }
                }
            });

            // This shared listener will update all charts
            socket.on('update', function (data) {
                const tempValue = data[tempNodeKey];
                const humValue = data[humNodeKey];

                // Only update if both values are present
                if (tempValue !== undefined && humValue !== undefined) {
                    const formattedTemp = parseFloat(tempValue).toFixed(2);
                    const formattedHum = parseFloat(humValue).toFixed(2);

                    tempElement.textContent = formattedTemp;
                    humElement.textContent = formattedHum;

                    // Update chart data
                    chart.data.labels.push(new Date());
                    chart.data.datasets[0].data.push(formattedTemp);
                    chart.data.datasets[1].data.push(formattedHum);

                    // Keep only the last 20 data points for performance
                    const maxDataPoints = 20;
                    if (chart.data.labels.length > maxDataPoints) {
                        chart.data.labels.shift();
                        chart.data.datasets.forEach(dataset => dataset.data.shift());
                    }

                    chart.update(); // Use 'none' for smoother animation
                }
            });
        }

        // This Jinja loop now generates the JavaScript calls needed to set up each card.
        // All hardcoding is gone.
        {% for item in dashboard_items %}
            setupDepartment(
                "{{ item.name }}",
                "{{ item.name|slugify }}",
                "{{ item.temperature_node_key }}",
                "{{ item.humidity_node_key }}"
            );
        {% endfor %}
    </script>
  </body>
</html>
{% endblock %}
