{% extends "iot/tse.html" %} 
{% block title %}Dashboard{% endblock %} 
{% block content %}

<!-- Only load Chart.js libraries here. socket.io is already in tse.html -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0"></script>

<style>
  .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding-top: 60px;
    background-color: #e3f4ff;
  }
  .common-container {
    border: 1px solid black;
    border-radius: 15px;
    height: 260px;
    width: 96%;
    padding: 10px;
    background: linear-gradient(#0076ce 0%, #add8e6 58%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    color: white;
    box-sizing: border-box;
  }
  .common-container h2 {
    font-size: 24px;
    margin: 5px 0;
    text-align: center;
  }
  .sensor-data {
    font-family: "Times New Roman", Times, serif;
    font-size: 15px;
    text-align: center;
    margin-bottom: 5px;
  }
  .chart-container {
    width: 100%;
    height: 160px;
    background-color: white;
    border-radius: 10px;
    margin-top: 5px;
    padding: 5px;
    box-sizing: border-box;
  }
</style>

<div class="container">
  {% for item in dashboard_items %}
  <div class="common-container">
    <h2>{{ item.name }}</h2>
    <div class="sensor-data">
      <div
        style="
          display: flex;
          justify-content: space-evenly;
          width: 100%;
          font-weight: bold;
        "
      >
        {% for sensor in item.sensors %}
        <div>
            <span id="{{ item.name|slugify }}_{{ loop.index0 }}">0.00</span> {{ sensor.unit }}
        </div>
        {% endfor %}
      </div>
    </div>
    <div class="chart-container">
      <canvas id="chart_{{ item.name|slugify }}"></canvas>
    </div>
  </div>
  {% endfor %}
</div>

<script>
  /**
   * Sets up a generic department card with dynamic sensors.
   * Uses the global 'socket' initialized in tse.html.
   */
  function setupDepartment(name, slug, sensors) {
    const canvas = document.getElementById(`chart_${slug}`);
    if(!canvas) return;

    const chartCtx = canvas.getContext('2d');
    
    // Prepare DOM elements map for quick access
    const domElements = sensors.map((s, index) => {
        return document.getElementById(`${slug}_${index}`);
    });

    // Prepare Chart Datasets dynamically
    const datasets = sensors.map(s => ({
        label: s.label,
        data: [],
        backgroundColor: s.color,
        borderColor: s.color,
        borderWidth: 2,
        pointRadius: 2, 
        pointHoverRadius: 5
    }));

    const chart = new Chart(chartCtx, {
        type: 'line',
        data: {
            labels: [],
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { 
                    type: 'time', 
                    time: { unit: 'second' }, 
                    ticks: { font: { size: 9 }, maxTicksLimit: 5 },
                    grid: { display: false }
                },
                y: { 
                    beginAtZero: true, 
                    ticks: { font: { size: 9 } } 
                }
            },
            plugins: {
                legend: { 
                    display: true,
                    labels: {
                        boxWidth: 8,
                        padding: 10,
                        font: { size: 10 }
                    }
                } 
            },
            animation: false // Improved performance
        }
    });

    // Listen for updates from the global socket
    if (typeof socket !== 'undefined') {
        socket.on('update', function (data) {
            let hasUpdate = false;
            const now = new Date();

            sensors.forEach((sensor, index) => {
                const val = data[sensor.key];
                if (val !== undefined && val !== null) {
                    const formattedVal = parseFloat(val).toFixed(2);
                    
                    // Update Text
                    if (domElements[index]) {
                        domElements[index].textContent = formattedVal;
                    }

                    // Update Chart Data
                    chart.data.datasets[index].data.push(formattedVal);
                    hasUpdate = true;
                }
            });

            if (hasUpdate) {
                chart.data.labels.push(now);

                // Keep only last 20 points
                const maxDataPoints = 30;
                if (chart.data.labels.length > maxDataPoints) {
                    chart.data.labels.shift();
                    chart.data.datasets.forEach(ds => ds.data.shift());
                }

                chart.update('none'); // Update without full animation redraw
            }
        });
    } else {
        console.error("Socket not defined. Ensure tse.html initializes the socket connection.");
    }
  }

  // Generate setup calls via Jinja
  {% for item in dashboard_items %}
    setupDepartment(
        "{{ item.name }}",
        "{{ item.name|slugify }}",
        {{ item.sensors | tojson }}
    );
  {% endfor %}
</script>

{% endblock %}
