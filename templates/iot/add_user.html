{% extends "iot/tse.html" %} {% block title %}Add User{% endblock %} {% block
content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/manage_style.css') }}" />

<div class="page-wrapper">
  <div class="config-card" style="max-width: 500px;">
    <h2>Add New User</h2>
  <div class="form-title">
    <div class="icon-circle">
      <i class="fas fa-user-plus"></i>
    </div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %} {% if
  messages %} {% for category, message in messages %}
  <div class="flash-message {{ category }}">
    {{ message }}
    <button
      class="close-btn"
      onclick="this.parentElement.style.display='none';"
    >
      &times;
    </button>
  </div>
  {% endfor %} {% endif %} {% endwith %}

  <form method="POST" action="/add_user">
    <div class="form-group">
      <label for="username">Username:</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter username"
        required
      />
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        required
      />
    </div>
    <div class="form-group">
      <label for="role">Role:</label>
      <div class="role-options">
        <label
          ><input type="radio" name="role" value="Operator" required />
          Operator</label
        >
        <label
          ><input type="radio" name="role" value="Manager" required />
          Manager</label
        >
        <label
          ><input type="radio" name="role" value="Tse" required /> Tse</label
        >
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Add User</button>
    </div>
  </form>
</div>
{% endblock %}
