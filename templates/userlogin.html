<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f0f2f5; /* Light grey background for better contrast */
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-top: 120px;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #2f3439;
        }

        .form-group label {
            margin-bottom: 10px;
            color: #495057;
        }

        .form-control {
            border: 1px solid #ced4da;
            border-radius: 5px;
        }

        .btn-primary {
            margin-top: 30px;
            background-color: #007bff;
            border-color: #007bff;
            border-radius: 5px;
            padding: 10px 20px;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .alert-danger {
            margin-top: 15%;
            margin-bottom: -8%;
            color: #721c24;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 style="margin-bottom: -8%;">User Login</h2>
        {% if message %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endif %}
        <!-- Corrected: url_for points to the correct login handling function -->
        <form action="{{ url_for('handle_user_login') }}" method="post">
            <div class="form-group" style="margin-top: 50px;">
                <label for="username">
                    <h6>Username:</h6>
                </label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="pwd">
                    <h6>Password:</h6>
                </label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
</body>

</html>
