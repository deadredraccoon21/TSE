<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title style="text-align: center">Report</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='print.css') }}"
      media="print"
    />
    <!-- CSS Remains the same as your input -->
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
        color: black;
      }
      tr:nth-child(even) {
        background-color: #f5f5f5;
      }
      tr:nth-child(odd) {
        background-color: white;
      }
      th {
        background-color: #dcdcdc;
        color: #000;
      }
      th:first-child,
      td:first-child {
        width: 6%;
      }
      h1 {
        text-align: center;
      }
      h1::after {
        content: "";
        display: block;
        margin: auto;
        width: 30%;
        padding-top: 5px;
      }
      h2 {
        text-align: center;
        margin-top: 15px;
      }
      .inline-group {
        display: inline-block;
        margin-right: 20px;
      }
      .inline-group label {
        margin-right: 5px;
      }
      .button-container {
        position: absolute;
        top: 96px;
        right: 20px;
        display: flex;
        gap: 10px;
      }
      .generate-button,
      .print-button,
      .toggle-names-button {
        padding: 7px 14px;
        border: none;
        border-radius: 8px;
        background-color: #101010;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }
      .generate-button:hover,
      .print-button:hover,
      .toggle-names-button:hover {
        background-color: #333333;
        transform: scale(1.05);
      }
      @media print {
        button.print-button,
        button.generate-button,
        button.toggle-names-button,
        .to-hide-print {
          display: none !important;
        }
        h2 {
          margin-bottom: -40px;
        }
      }
      .report-buttons-wrapper {
        position: relative;
        margin-top: 20px;
        text-align: right;
        margin-right: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
    </style>
  </head>

  <body
    style="background-color: #e3f4ff; margin-top: 2%; font-family: sans-serif"
  >
    <h1><u>{{ client_name }}</u></h1>
    <h2 id="department-heading"></h2>
    <br />

    <div style="transform: scale(0.95); transform-origin: top">
      <div
        class="form-container"
        style="
          display: flex;
          flex-wrap: nowrap;
          justify-content: space-between;
          gap: 50px;
          align-items: center;
        "
      >
        <div
          class="inline-group to-hide-print"
          style="flex: 1; text-align: center"
        >
          <label
            for="department"
            style="
              display: block;
              font-size: large;
              font-weight: bold;
              margin-bottom: 5px;
            "
            ><b>Department</b></label
          >
          <select
            id="department"
            style="
              padding: 8px;
              width: 100%;
              border: 1px solid black;
              border-radius: 10px;
              background-color: #f0f0f0;
              color: #333;
              font-size: 16px;
              text-align: center;
            "
          >
            {% for department_option in department_options %}
            <option value="{{ department_option }}">
              {{ department_option }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div
          class="inline-group to-hide-print"
          style="flex: 1; text-align: center"
        >
          <label
            for="from_date"
            style="
              display: block;
              font-size: large;
              font-weight: bold;
              margin-bottom: 5px;
              text-align: center;
            "
            ><b>From Date</b></label
          >
          <input
            type="date"
            id="from_date"
            style="
              padding: 8px;
              width: 100%;
              border: 1px solid black;
              border-radius: 10px;
              background-color: #f0f0f0;
              color: #333;
              font-size: 16px;
              text-align: center;
            "
          />
        </div>
        <div
          class="inline-group to-hide-print"
          style="flex: 1; text-align: center"
        >
          <label
            for="to_date"
            style="
              display: block;
              font-size: large;
              font-weight: bold;
              margin-bottom: 5px;
            "
            ><b>To Date</b></label
          >
          <input
            type="date"
            id="to_date"
            style="
              padding: 8px;
              width: 100%;
              border: 1px solid black;
              border-radius: 10px;
              background-color: #f0f0f0;
              color: #333;
              font-size: 16px;
              text-align: center;
            "
          />
        </div>
        <div
          class="inline-group to-hide-print"
          style="flex: 1; text-align: center"
        >
          <label
            for="time_difference"
            style="
              display: block;
              font-size: large;
              font-weight: bold;
              margin-bottom: 5px;
            "
            ><b>Time Duration</b></label
          >
          <select
            id="time_difference"
            style="
              padding: 8px;
              width: 100%;
              border: 1px solid black;
              border-radius: 10px;
              background-color: #f0f0f0;
              color: #333;
              font-size: 16px;
              text-align: center;
            "
          >
            <option value="">None</option>
            <option value="1 hour">1 hour</option>
            <option value="2 hours">2 hours</option>
            <option value="5 hours">5 hours</option>
            <option value="1 Day">1 Day</option>
          </select>
        </div>
      </div>

      <div class="report-buttons-wrapper to-hide-print">
        <button class="generate-button" onclick="getData()">
          <b>Generate Report</b>
        </button>
        <button
          id="toggleColumnNameButton"
          class="toggle-names-button"
          onclick="toggleColumnNames()"
        >
          <b>Expand Names</b>
        </button>
        <button class="print-button" onclick="prepareAndPrintReport()">
          <i class="fas fa-print"></i>
        </button>
      </div>
      <br /><br />
    </div>

    <div style="transform: scale(0.95); transform-origin: top">
      <table id="table-report"></table>
    </div>

    <script>
      // --- 1. Get the configured columns from Flask (input.yaml) ---
      const globalReportFields = {{ report_fields | tojson | default([]) }};

      // --- 2. Mapping for "Expand Names" ---
      const shortToLongColumnNames = {
          'Set_RH': 'Relative Humidity Set Point %',
          'Act_RH': 'Actual Relative Humidity %',
          'Pump_Output': 'Pump Output %',
          'Pump_Status': 'Pump Status',
          'SAF_Speed': 'Supply Air Fan Speed %',
          'RetAF_Speed': 'Return Air Fan Speed %',
          'Set_Temp': 'Relative Temperature Set Point °C',
          'Act_Temp': 'Actual Temperature °C',
          'Act_SA_Temp': 'Supply Air Temperature °C',
          'Set_SA_Temp': 'Supply Air Temperature Set Point °C',
          'Damper_Output': 'Damper Output %',
          'Act_PR': 'Actual Pressure Pa',
          'Set_PR': 'Pressure Set Point Pa',
          'RadialFan_Speed': 'Radial Fan Output Speed %',
      };

      let longToShortColumnNames = {};
      for (const key in shortToLongColumnNames) {
          longToShortColumnNames[shortToLongColumnNames[key]] = key;
      }

      let areColumnNamesExtended = false;

      function getData() {
          var department = document.getElementById('department').value;
          var from_date = document.getElementById('from_date').value;
          var to_date = document.getElementById('to_date').value;
          var time_difference = document.getElementById('time_difference').value;

          // --- LOGIC: Always use the globally configured fields from admin page ---
          var selected_fields = globalReportFields;

          if (!from_date || !to_date) {
              alert("Please select both a 'From Date' and a 'To Date'.");
              return;
          }

          // NOTE: The backend API /data will automatically filter these fields.
          // If a field in 'selected_fields' doesn't exist in the 'department' table,
          // the backend just ignores it and returns what matches.
          fetch('/data', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body: 'department=' + encodeURIComponent(department) +
                      '&from_date=' + encodeURIComponent(from_date) +
                      '&to_date=' + encodeURIComponent(to_date) +
                      '&time_difference=' + encodeURIComponent(time_difference) +
                      '&selected_fields=' + encodeURIComponent(selected_fields.join(','))
              })
              .then(response => {
                  if (!response.ok) throw new Error('Network response was not ok');
                  return response.json();
              })
              .then(data => {
                  if (data.error) { alert('Error: ' + data.error); return; }
                  displayData(data.columns, data.data);
                  areColumnNamesExtended = false;
                  document.getElementById('toggleColumnNameButton').innerHTML = '<b>Expand Names</b>';
              })
              .catch(error => {
                  console.error('Error:', error);
                  alert('Error fetching data.');
              });
      }

      function displayData(columns, data) {
          const table = document.getElementById('table-report');
          let table_html = '<thead><tr>';

          table_html += '<th style="text-align:center;">Sl.No.</th>';
          columns.forEach(key => {
              const headerText = key.charAt(0).toUpperCase() + key.slice(1);
              table_html += `<th style="text-align:center;" data-backend-key="${key}">${headerText}</th>`;
          });
          table_html += '</tr></thead><tbody>';

          data.forEach((row, i) => {
              table_html += '<tr>';
              table_html += '<td style="text-align:center;">' + (i + 1) + '</td>';
              columns.forEach(key => {
                  let val = row[key] !== undefined && row[key] !== null ? row[key] : '';
                  if (key === 'time' && typeof val === 'string' && val.length > 5) {
                      val = val.substring(0, 5);
                  }
                  table_html += '<td style="text-align:center;">' + val + '</td>';
              });
              table_html += '</tr>';
          });
          table_html += '</tbody>';
          table.innerHTML = table_html;
      }

      function toggleColumnNames() {
          areColumnNamesExtended = !areColumnNamesExtended;
          applyNameToggle(areColumnNamesExtended);
          document.getElementById('toggleColumnNameButton').innerHTML = areColumnNamesExtended ? '<b>Shorten Names</b>' : '<b>Expand Names</b>';
      }

      function applyNameToggle(extend) {
          const table = document.getElementById('table-report');
          if (!table) return;
          const headers = table.querySelectorAll('thead th');

          headers.forEach(th => {
              const currentText = th.textContent;
              if (currentText === 'Sl.No.' || currentText === 'Date' || currentText === 'Time') return;

              if (extend) {
                  let mapped = shortToLongColumnNames[currentText];
                  if (mapped) th.textContent = mapped;
              } else {
                  if (longToShortColumnNames[currentText]) th.textContent = longToShortColumnNames[currentText];
              }
          });
      }

      function prepareAndPrintReport() { window.print(); }

      document.addEventListener('DOMContentLoaded', function () {
          const departmentDropdown = document.getElementById('department');
          if(departmentDropdown.value) document.getElementById('department-heading').innerText = departmentDropdown.value;
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('from_date').value = today;
          document.getElementById('to_date').value = today;
          departmentDropdown.addEventListener('change', function () {
              document.getElementById('department-heading').innerText = this.value;
          });
      });
    </script>
  </body>
</html>
