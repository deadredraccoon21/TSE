<head>

    <style>
        /* General page styles */
        body {
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
            -webkit-touch-callout: none;
            context-menu: none;
        }

        /* --- NEW: CSS Classes for Button Status --- */
        .status-button {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            outline: none;
            transition: background-color 0.3s ease, box-shadow 0.3s ease, border 0.3s ease;
            border: 1px solid black;
        }

        .status-on {
            background-color: #28a745; /* Green */
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.8);
        }

        .status-off {
            background-color: #dc3545; /* Red */
        }

        .status-trip {
            background-color: #ffc107; /* Yellow */
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.8);
            border: 1px solid black;
        }

        .status-normal {
            background-color: white;
            border: none;
        }
    </style>
</head>

            "DI_Spg1_iFl_ScrewCompactor1_ON": "screwcompactor1-on-off", "DI_Spg1_iFl_ScrewCompactor1_OFF": "screwcompactor1-on-off", "DI_Spg1_iFl_ScrewCompactor1_TRIP": "screwcompactor1-trip",

            "DI_Spg1_iFl_WasherPump1_ON": "washerpump1-on-off", "DI_Spg1_iFl_WasherPump1_OFF": "washerpump1-on-off", "DI_Spg1_iFl_WasherPump1_TRIP": "washerpump1-trip",
        };

        socket.on('update', function (data) {
            // Part 1: Update all numerical/text values
            const valueIds = [
                'Spg1_iVa_DPG_RDF', 'Spg1_iVa_UPSS_Output_RAF', 'Spg1_iVa_Pump_Output',
                'Spg1_iVa_Act_SA_Temp', 'Spg1_iVa_UPSS_Output_SAF', 'Spg1_iMi_Set_RH',
                'Spg1_iMi_Set_Temp', 'Spg1_iVa_Act_RH', 'Spg1_iVa_Act_Temp',
                'Spg1_iVa_Damper_Output', 'Spg1_iVa_Ret_Damper_Output'
            ];
            valueIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = data[id] || '0';
                }
            });
            // Handle the duplicated damper output
            const damper2 = document.getElementById('Spg1_iVa_Damper_Output2');
            if (damper2) {
                damper2.textContent = data['Spg1_iVa_Damper_Output'] || '0';
            }

            // Part 2: Update all button colors
            for (const nodeId in data) {
                if (nodeMappings[nodeId]) {
                    updateButtonColors(nodeId, data[nodeId]);
                }
            }

            // Part 3: Update all fan images based on new button colors
            updateFanImage("RAFan1", "RAFan1-on-off", "RAFan1-trip");
            updateFanImage("RAFan2", "RAFan2-on-off", "RAFan2-trip");
            updateFanImage("SAFan1", "SAFan1-on-off", "SAFan1-trip");
            updateFanImage("SAFan2", "SAFan2-on-off", "SAFan2-trip");
        });

        function updateButtonColors(nodeId, value) {
            const buttonId = nodeMappings[nodeId];
            const button = document.getElementById(buttonId);
            if (!button) return;

            button.classList.remove("status-on", "status-off", "status-trip", "status-normal");
            if (nodeId.includes("_TRIP")) {
                button.classList.add(value ? "status-trip" : "status-normal");
            } else if (nodeId.includes("_ON")) {
                button.classList.add(value ? "status-on" : "status-off");
            } else if (nodeId.includes("_OFF")) {
                button.classList.add(value ? "status-off" : "status-on");
            }
        }

        function updateFanImage(fanId, onOffButtonId, tripButtonId) {
            const fanImage = document.getElementById(fanId);
            const onOffButton = document.getElementById(onOffButtonId);
            const tripButton = document.getElementById(tripButtonId);
            if (!fanImage || !onOffButton || !tripButton) return;

            const onOffColor = window.getComputedStyle(onOffButton).backgroundColor;
            const tripColor = window.getComputedStyle(tripButton).backgroundColor;
            
            if (onOffColor === "rgb(220, 53, 69)" || tripColor === "rgb(255, 193, 7)") {
                fanImage.src = "{{ url_for('static', filename='images/fan_stopped.png') }}";
            } else {
                fanImage.src = "{{ url_for('static', filename='images/fan000.gif') }}";
            }
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
{% endblock %}
