{% extends "iot/tse.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="static\css\font.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <style>

            display: flex;
            flex-wrap: wrap;

        .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* Adjust the number of columns based on your layout */
    gap: 10px; /* Space between the containers */
    padding-top: 60px;
    background-color: #e3f4ff;
}

.common-container {
    border: 1px solid black;
    border-radius: 15px;
    height: 260px;
    width: 96%;
    padding: 10px;
    background: linear-gradient(#0076CE 0%, #ADD8E6 58%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    color: white;
    box-sizing: border-box;
}


        .common-container h2 {
            font-size: 24px;
            margin: 5px 0;
            text-align: center;
        }

        .sensor-data {
            font-family: 'Times New Roman', Times, serif;
            font-size: 15px;
            text-align: center;
            margin-bottom: 10px;
        }

        .chart-container {
            width: 100%;
            height: 160px;
            background-color: white;
            border-radius: 10px;
            margin-top: 10px;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #002366;
            color: white;
            text-align: center;
            padding: 10px;
            z-index: 100;
        }
    </style>
</head>

<body>

    <div class="container">
        {% for name, template in submodules.items() %}
        <div class="common-container">
            <h2>{{ name }}</h2>
            <div class="sensor-data">
                <div style="display: flex; justify-content: space-between; width: 100%; font-weight: bold;">
                    <div><span id="temperature{{ loop.index }}">0.00</span> °C</div>
                    <div><span id="humidity{{ loop.index }}">0.00</span> %RH</div>
                </div>
            </div>

            <!-- Graph Section -->
            <div class="chart-container">
                <canvas id="myChart{{ loop.index }}"></canvas>
            </div>
        </div>
        {% endfor %}
    </div>

   <script>
        // This function remains the same as it maps department names to Node IDs.
        function getNodeIds(departmentName) {
            const nodeIds = {
                'Preparatory 1': { temperature: "Preparatory 1_Temp", humidity: "Preparatory 1_RH" },
                'Preparatory 2': { temperature: "Preparatory 2_Temp", humidity: "Preparatory 2_RH" },
                'Spinning': { temperature: "Spinning 1_Temp", humidity: "Spinning 1_RH" },
                'Autoconer': { temperature: "Autoconer_Temp", humidity: "Autoconer_RH" }
            };
            return nodeIds[departmentName];
        }
    
        // Updated helper function to get the exact display name you described
        function getDepartmentDisplayName(templateName) {
            // 1. Remove '.html' from the end
            console.log(`Processing template: ${templateName}`);
            let displayName = templateName.replace('.html', '');
    
            // 2. Replace a common pattern like 'spinning1' with 'spinning 1'
            // This handles cases like 'spinning1', 'preparatory2', 'linkconer2'
            displayName = displayName.replace(/([a-zA-Z]+)(\d+)/, '$1 $2');
    
            // 3. Capitalize the first letter of the *entire* string
            displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
    
            return displayName;
        }
    
        function setupDepartment(templateName, departmentIndex) {
            // Convert the templateName to the actual department display name
            const departmentDisplayName = getDepartmentDisplayName(templateName);
    
            const nodeIds = getNodeIds(departmentDisplayName); // Use the display name here
            if (!nodeIds) {
                console.error(`Error: Node IDs not found for department: ${departmentDisplayName}`);
                return; // Exit if department name doesn't map to node IDs
            }
    
            const chartCtx = document.getElementById('myChart' + departmentIndex).getContext('2d');
    
            const chart = new Chart(chartCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Temperature', data: [], backgroundColor: 'rgba(255, 148, 112)', borderColor: 'rgba(255, 148, 112)' },
                        { label: 'Humidity', data: [], backgroundColor: 'rgba(40, 67, 135)', borderColor: 'rgba(40, 67, 135)' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'second' },
                            ticks: {
                                font: { size: 10 },
                                maxTicksLimit: 6
                            }
                        },
                        y: { beginAtZero: true }
                    }
                }
            });
    
            const socket = io.connect('http://192.168.106.187:7005');
    
            socket.on('update', function (data) {
                // Check if nodeIds are valid for the department and data exists
                if (nodeIds && data[nodeIds.temperature] !== undefined && data[nodeIds.humidity] !== undefined) {
                    const temp = data[nodeIds.temperature];
                    const hum = data[nodeIds.humidity];
                    const formattedTemp = parseFloat(temp.toFixed(2));
                    const formattedHum = parseFloat(hum.toFixed(2));
    
                    // Update the elements with the actual data (assuming they use `departmentIndex`)
                    const tempElement = document.getElementById('temperature' + departmentIndex);
                    const humElement = document.getElementById('humidity' + departmentIndex);
    
                    if (tempElement) tempElement.textContent = formattedTemp.toFixed(2);
                    if (humElement) humElement.textContent = formattedHum.toFixed(2);
    
                    chart.data.labels.push(new Date());
                    chart.data.datasets[0].data.push(formattedTemp);
                    chart.data.datasets[1].data.push(formattedHum);
    
                    // Keep only the last 20 data points
                    const maxDataPoints = 20;
                    if (chart.data.labels.length > maxDataPoints) {
                        chart.data.labels.shift();
                        chart.data.datasets[0].data.shift();
                        chart.data.datasets[1].data.shift();
                    }
    
                    chart.update();
                } else {
                    console.warn(`Data not found or node IDs are undefined for department: ${departmentDisplayName}. Skipping update.`);
                }
            });
        }
    
        // Loop through submodules to set up charts for relevant templates
        {% for name, template_file in submodules.items() %}
            {# CORRECTED Jinja2 conditional: using 'in' operator and 'endswith' filter #}
            {% if '.html' in template_file and (template_file.startswith('spinning') or template_file.startswith('preparatory') or template_file.startswith('linkconer')) or template_file.startswith('autoconer') %}
                setupDepartment('{{ template_file }}', {{ loop.index }});
            {% endif %}
        {% endfor %}
    </script>
</body>

</html>

{% endblock %}
