        <script>
            // Establish a socket connection
            const socket = io();

            // =========================================================================
            // === NEW SCRIPT BLOCK: All real-time updates are handled here          ===
            // =========================================================================

            // Mapping Node IDs to the HTML element IDs for buttons
            const nodeMappings = {
                "DI_Spg2_iFl_RetAFan1_ON": "fan1-on-off", "DI_Spg2_iFl_RetAFan1_OFF": "fan1-on-off", "DI_Spg2_iFl_RetAFan1_TRIP": "fan1-trip",
                "DI_Spg2_iFl_RetAFan2_ON": "fan2-on-off", "DI_Spg2_iFl_RetAFan2_OFF": "fan2-on-off", "DI_Spg2_iFl_RetAFan2_TRIP": "fan2-trip",
                "DI_Spg2_iFl_SAFan1_ON": "fan3-on-off", "DI_Spg2_iFl_SAFan1_OFF": "fan3-on-off", "DI_Spg2_iFl_SAFan1_TRIP": "fan3-trip",
                "DI_Spg2_iFl_RDF1_ON": "rdf1-on-off", "DI_Spg2_iFl_RDF1_OFF": "rdf1-on-off", "DI_Spg2_iFl_RDF1_TRIP": "rdf1-trip",
                "DI_Spg2_iFl_DCF1_ON": "dcf1-on-off", "DI_Spg2_iFl_DCF1_OFF": "dcf1-on-off", "DI_Spg2_iFl_DCF1_TRIP": "dcf1-trip",
                "DI_Spg2_iFl_ScrewCompactor1_ON": "screwcompactor1-on-off", "DI_Spg2_iFl_ScrewCompactor1_OFF": "screwcompactor1-on-off", "DI_Spg2_iFl_ScrewCompactor1_TRIP": "screwcompactor1-trip",
                "DI_Spg2_iFl_WasherPump1_ON": "washerpump1-on-off", "DI_Spg2_iFl_WasherPump1_OFF": "washerpump1-on-off", "DI_Spg2_iFl_WasherPump1_TRIP": "washerpump1-trip",
            };

            // Main function to handle incoming data from the server
            socket.on('update', function (data) {
                // --- Part 1: Update all numerical/text values ---
                document.getElementById('Spg2_iMi_Set_RH').textContent = data['Spg2_iMi_Set_RH'] || '0';
                document.getElementById('Spg2_iMi_Set_Temp').textContent = data['Spg2_iMi_Set_Temp'] || '0';
                document.getElementById('spg2_iVa_DPG_RDF').textContent = data['Spg2_iVa_DPG_RDF'] || '0';
                // document.getElementById('spg2_iVa_UPSS_Output_RAF').textContent = data['Spg2_iVa_UPSS_Output_RAF'] || '0';
                document.getElementById('spg2_iVa_Pump_Output').textContent = data['Spg2_iVa_Pump_Output'] || '0';
                document.getElementById('spg2_iVa_Act_SA_Temp').textContent = data['Spg2_iVa_Act_SA_Temp'] || '0';
                // document.getElementById('spg2_iVa_UPSS_Output_SAF').textContent = data['Spg2_iVa_UPSS_Output_SAF'] || '0';
                document.getElementById('spg2_iVa_Act_RH').textContent = data['Spg2_iVa_Act_RH'] || '0';
                document.getElementById('spg2_iVa_Act_Temp').textContent = data['Spg2_iVa_Act_Temp'] || '0';
                document.getElementById('Spg2_iVa_Damper_Output').textContent = data['Spg2_iVa_Damper_Output'] || '0';
                document.getElementById('Spg2_iVa_Damper_Output2').textContent = data['Spg2_iVa_Damper_Output'] || '0';
                document.getElementById('Spg2_iVa_Ret_Damper_Output').textContent = data['Spg2_iVa_Ret_Damper_Output'] || '0';

                // --- Part 2: Update all button colors based on trip/status signals ---
                for (const nodeId in data) {
                    if (nodeMappings[nodeId]) {
                        updateButtonColors(nodeId, data[nodeId]);
                    }
                }
                
                // --- Part 3: Update fan images based on the new button colors ---
                updateFanImage("fan1", "fan1-on-off", "fan1-trip");
                updateFanImage("fan3", "fan3-on-off", "fan3-trip");
            });

            // MODIFIED: Helper function to update button colors using CSS classes
            function updateButtonColors(nodeId, value) {
                const buttonId = nodeMappings[nodeId];
                const button = document.getElementById(buttonId);

                if (!button) return;

                // Remove all possible status classes before adding the new one
                button.classList.remove("status-on", "status-off", "status-trip", "status-normal");

                if (nodeId.includes("_TRIP")) {
                    button.classList.add(value ? "status-trip" : "status-normal");
                } else if (nodeId.includes("_ON")) {
                    button.classList.add(value ? "status-on" : "status-off");
                } else if (nodeId.includes("_OFF")) {
                    button.classList.add(value ? "status-off" : "status-on");
                }
            }

            // MODIFIED: Helper function to update fan image based on COMPUTED button colors
            function updateFanImage(fanId, onOffButtonId, tripButtonId) {
                const fanImage = document.getElementById(fanId);
                const onOffButton = document.getElementById(onOffButtonId);
                const tripButton = document.getElementById(tripButtonId);
                
                if (!fanImage || !onOffButton || !tripButton) return;
                
                // Get the final, rendered color of the buttons
                const onOffColor = window.getComputedStyle(onOffButton).backgroundColor;
                const tripColor = window.getComputedStyle(tripButton).backgroundColor;

                // Check against the RGB values of the colors defined in CSS
                // #dc3545 -> rgb(220, 53, 69) and #ffc107 -> rgb(255, 193, 7)
                if (onOffColor === "rgb(220, 53, 69)" || tripColor === "rgb(255, 193, 7)") { // If Red or Yellow
                    fanImage.src = "{{ url_for('static', filename='images/fan_stopped.png') }}";
                } else {
                    fanImage.src = "{{ url_for('static', filename='images/fan000.gif') }}";
                }
            }
            
            // Prevent right-click context menu
            document.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });

        </script>
