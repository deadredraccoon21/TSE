<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="text-align: center;">Report</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='print.css') }}" media="print">

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
            color: black;
        }

        tr:nth-child(even) {
            background-color: #F5F5F5;
        }

        tr:nth-child(odd) {
            background-color: white;
        }

        th {
            background-color: #DCDCDC;
            color: #000; /* Changed to black for better contrast */
        }

        th:first-child,
        td:first-child {
            width: 6%;
        }

        h1 {
            text-align: center;
        }

        h1::after {
            content: "";
            display: block;
            margin: auto;
            width: 30%;
            padding-top: 5px;
        }
        
        h2 {
            text-align: center;
            margin-top: 15px;
        }

        .inline-group {
            display: inline-block;
            margin-right: 20px;
        }

        .inline-group label {
            margin-right: 5px;
        }

        .button-container {
            position: absolute;
            top: 96px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .generate-button,
        .print-button,
        .toggle-names-button {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            background-color: #101010;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .generate-button:hover,
        .print-button:hover,
        .toggle-names-button:hover {
            background-color: #333333;
            transform: scale(1.05);
        }

        @media print {

            button.print-button,
            button.generate-button,
            button.toggle-names-button,
            .to-hide-print {
                display: none !important;
            }

            h2 {
                margin-bottom: -40px;
            }
        }
        
        .report-buttons-wrapper {
            position: relative;
            margin-top: 20px;
            text-align: right;
            margin-right: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>

<body style="background-color: #e3f4ff; margin-top: 2%; font-family: sans-serif; ">
    <h1><u>{{ client_name }}</u></h1>
    <h2 id="department-heading"></h2> <br>

    <div style="transform: scale(0.95); transform-origin: top; ">

        <div class="form-container"
            style="display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 50px; align-items: center;">

            <div class="inline-group to-hide-print" style="flex: 1; text-align: center;">
                <label for="department"
                    style="display: block; font-size: large; font-weight: bold; margin-bottom: 5px;"><b>
                        Department</b></label>
                <select id="department"
                    style="padding: 8px; width: 100%; border: 1px solid black; border-radius: 10px; background-color: #F0F0F0; color: #333; font-size: 16px; text-align: center;">
                    {% for department_option in department_options %}
                    <option value="{{ department_option }}">{{ department_option }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="inline-group to-hide-print" style="flex: 1; text-align: center;">
                <label for="from_date"
                    style="display: block; font-size: large; font-weight: bold; margin-bottom: 5px; text-align: center;"><b>From
                        Date</b></label>
                <input type="date" id="from_date"
                    style="padding: 8px; width: 100%; border: 1px solid black; border-radius: 10px; background-color: #F0F0F0; color: #333; font-size: 16px;text-align: center;">
            </div>

            <div class="inline-group to-hide-print" style="flex: 1; text-align: center;">
                <label for="to_date" style="display: block; font-size: large; font-weight: bold; margin-bottom: 5px;"><b>To
                        Date</b></label>
                <input type="date" id="to_date"
                    style="padding: 8px; width: 100%; border: 1px solid black; border-radius: 10px; background-color: #F0F0F0; color: #333; font-size: 16px;text-align: center;">
            </div>

            <div class="inline-group to-hide-print" style="flex: 1; text-align: center;">
                <label for="time_difference"
                    style="display: block; font-size: large; font-weight: bold; margin-bottom: 5px;"><b>Time
                        Duration</b></label>
                <select id="time_difference"
                    style="padding: 8px; width: 100%; border: 1px solid black; border-radius: 10px; background-color: #F0F0F0; color: #333; font-size: 16px;text-align: center;">
                    <option value="">None</option>
                    <!-- <option value="10 minutes">10 minutes</option>
                    <option value="30 minutes">30 minutes</option> -->
                    <option value="1 hour">1 hour</option>
                    <option value="2 hours">2 hours</option>
                    <option value="5 hours">5 hours</option>
                    <option value="1 Day">1 Day</option>
                </select>
            </div>
        </div>

        <div class="report-buttons-wrapper to-hide-print">
            <button class="generate-button" onclick="getData()">
                <b>Generate Report</b>
            </button>
            <button id="toggleColumnNameButton" class="toggle-names-button" onclick="toggleColumnNames()">
                <b>Expand Names</b>
            </button>
            <button class="print-button" onclick="prepareAndPrintReport()">
                <i class="fas fa-print"></i>
            </button>
        </div>

        <br>
        <br>
    </div>

    <div style="transform: scale(0.95); transform-origin: top; ">
        <table id="table-report"></table>
    </div>

    <script>
        const shortToLongColumnNames = {
            'Set_RH': 'Relative Humidity Set Point',
            'Act_RH': 'Actual Relative Humidity',
            'WTC_Output': 'Pump Output',
            'WP_Status': 'Pump Status',
            'SAF_Speed': 'Supply Air Fan Speed',
            'RetAF_Speed': 'Return Air Fan Speed',
            'Set_Temp': 'Relative Temperature Set Point °C',
            'Act_temp': 'Actual Temperature °C', // Corrected key to match checkbox value
            'Act_WoT': 'Supply Air Temperature °C',
            'Set_WoT': 'Supply Air Temperature Set Point °C',
            'Damper_Output': 'Damper Output'
        };

        let longToShortColumnNames = {};
        for (const key in shortToLongColumnNames) {
            longToShortColumnNames[shortToLongColumnNames[key]] = key;
        }

        let areColumnNamesExtended = false;

        function getData() {
            var department = document.getElementById('department').value;
            var from_date = document.getElementById('from_date').value;
            var to_date = document.getElementById('to_date').value;
            var time_difference = document.getElementById('time_difference').value;
            // Get selected fields from localStorage, which is set on the admin page
            let selected_fields = JSON.parse(localStorage.getItem('selected_columns') || '[]');

            if (!from_date || !to_date) {
                alert("Please select both a 'From Date' and a 'To Date'.");
                return;
            }

            // The backend will automatically add 'date' and 'time', so we don't need to add them here.
            fetch('/data', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'department=' + encodeURIComponent(department) +
                        '&from_date=' + encodeURIComponent(from_date) +
                        '&to_date=' + encodeURIComponent(to_date) +
                        '&time_difference=' + encodeURIComponent(time_difference) +
                        '&selected_fields=' + encodeURIComponent(selected_fields.join(','))
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                       alert('Error from server: ' + data.error);
                       return;
                    }
                    // The backend now sends the final columns and merged data
                    displayData(data.columns, data.data);
                    areColumnNamesExtended = false;
                    document.getElementById('toggleColumnNameButton').innerHTML = '<b>Expand Names</b>';
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    alert('Error fetching data. Please check console for details.');
                });
        }
        
        // Corrected: displayData function now accepts the structure sent by the server
        function displayData(columns, data) {
            const table = document.getElementById('table-report');
            let table_html = '<thead><tr>';

            // --- HEADERS ---
            // The 'columns' array from the server dictates the order
            table_html += '<th style="text-align:center;">Sl.No.</th>';
            columns.forEach(key => {
                // Capitalize for display
                const headerText = key.charAt(0).toUpperCase() + key.slice(1);
                table_html += `<th style="text-align:center;" data-backend-key="${key}">${headerText}</th>`;
            });
            table_html += '</tr></thead><tbody>';

            // --- DATA ROWS ---
            data.forEach((row, i) => {
                table_html += '<tr>';
                table_html += '<td style="text-align:center;">' + (i + 1) + '</td>';
                columns.forEach(key => {
                    let val = row[key] !== undefined && row[key] !== null ? row[key] : '';
                    // Format time to exclude seconds if it exists
                    if (key === 'time' && typeof val === 'string' && val.length > 5) {
                        val = val.substring(0, 5);
                    }
                    table_html += '<td style="text-align:center;">' + val + '</td>';
                });
                table_html += '</tr>';
            });

            table_html += '</tbody>';
            table.innerHTML = table_html;

            // Re-apply name toggle if it was active
            if (areColumnNamesExtended) {
                applyNameToggle(true);
            }
        }


        function toggleColumnNames() {
            areColumnNamesExtended = !areColumnNamesExtended;
            applyNameToggle(areColumnNamesExtended);
            document.getElementById('toggleColumnNameButton').innerHTML = areColumnNamesExtended ? '<b>Shorten Names</b>' : '<b>Expand Names</b>';
        }

        function applyNameToggle(extend) {
            const table = document.getElementById('table-report');
            if (!table) return;
            const headers = table.querySelectorAll('thead th');
            
            headers.forEach(th => {
                const currentText = th.textContent;
                // Skip non-data columns
                if (currentText === 'Sl.No.' || currentText === 'Date' || currentText === 'Time') {
                    return;
                }

                if (extend) { // From Short to Long
                    if (shortToLongColumnNames[currentText]) {
                        th.textContent = shortToLongColumnNames[currentText];
                    }
                } else { // From Long to Short
                    if (longToShortColumnNames[currentText]) {
                        th.textContent = longToShortColumnNames[currentText];
                    }
                }
            });
        }
        
        function prepareAndPrintReport() {
            window.print();
        }

        // --- Event Listeners and Initial Setup ---
        document.addEventListener('DOMContentLoaded', function () {
            // Set department heading on load
            const departmentDropdown = document.getElementById('department');
            document.getElementById('department-heading').innerText = departmentDropdown.value;

            // Set default dates to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('from_date').value = today;
            document.getElementById('to_date').value = today;

            // Update heading when department changes
            departmentDropdown.addEventListener('change', function () {
                document.getElementById('department-heading').innerText = this.value;
            });
        });
    </script>
</body>

</html>
